# Site Settings
title: "CS Tutor & Creative Hub"
locale: "ro-RO"
description: "Project-based mentorship | Cărți pentru Copii | Poezii"
url: "https://info-vers.github.io"
baseurl: ""  # user page => empty baseurl

# Minimal Mistakes theme
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

# Required plugins for Minimal Mistakes
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

# Collections
collections:
  carti:
    output: true
    permalink: /carti/:path/
  versuri:
    output: true
    permalink: /versuri/:path/
  proiecte:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: "_carti"
    values:
      layout: "book-reader"
      author_profile: false
  - scope:
      path: "_versuri"
    values:
      layout: "poem-view"
      author_profile: false
  - scope:
      path: "_proiecte"
    values:
      layout: "project-grid"
      author_profile: false

# Navigation
navigation:
  - title: "Despre Mine"
    url: /
  - title: "Cărți Copii"
    url: /carti-copii/
  - title: "Versuri"
    url: /versuri/
  - title: "Proiecte"
    url: /proiecte/
