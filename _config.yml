# Site Settings
title: "CS Tutor & Creative Hub"
locale: "ro-RO"
description: "Meditații Informatică | Cărți pentru Copii | Poezii"
url: "https://info-vers.github.io"
baseurl: "" # keep empty for user pages

# Theme Configuration
#theme: "minimal-mistakes-jekyll"
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark" # We will override this with our custom.scss

# Collections
collections:
  carti:
    output: true
    permalink: /carti/:path/
  versuri:
    output: true
    permalink: /versuri/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: "_carti"
    values:
      layout: "single"
      author_profile: false
  - scope:
      path: "_versuri"
    values:
      layout: "single"
      author_profile: false

# Navigation
navigation:
  - title: "Despre Mine"
    url: /despre-mine/
  - title: "Cărți Copii"
    url: /carti-copii/
  - title: "Versuri"
    url: /versuri/
  - title: "Proiecte"
    url: /proiecte/
