---
layout: default
---

<link rel="stylesheet" href="{{ '/assets/css/mentorship-hub.css' | relative_url }}">

<style>
  .page__inner-wrap,
  .page__content {
    max-width: 1500px !important;
    width: 100% !important;
    margin: 0 auto !important;
  }

  .page__content {
    padding-left: 0 !important;
    padding-right: 0 !important;
  }

  #main .page .project-grid {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(290px, 1fr)) !important;
    gap: 32px !important;
    width: 100% !important;
    max-width: 1500px !important;
    margin: 30px auto 0 !important;
    align-items: stretch !important;
  }

  #main .page .project-card {
    display: flex !important;
    flex-direction: column !important;
    height: 100% !important;
    background: #0F172A !important;
    border: 1px solid #3b2f2b !important;
    border-radius: 16px !important;
    overflow: hidden !important;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28) !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
    min-width: 0 !important;
  }

  #main .page .project-card:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.34) !important;
  }

  #main .page .project-card__image {
    width: 100% !important;
    height: 220px !important;
    object-fit: cover !important;
    display: block !important;
    border-bottom: 1px solid rgba(217, 154, 114, 0.2) !important;
  }

  #main .page .project-card__body {
    display: flex !important;
    flex-direction: column !important;
    flex-grow: 1 !important;
    padding: 20px 20px 18px !important;
    color: #f3efe9 !important;
    background: #0F172A !important;
  }

  #main .page .project-card__meta-row {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    align-items: center !important;
    margin-bottom: 12px !important;
  }

  #main .page .project-card__tag,
  #main .page .project-card__badge {
    display: inline-flex !important;
    align-items: center !important;
    border-radius: 999px !important;
    padding: 4px 8px !important;
    font-size: 0.68rem !important;
    line-height: 1.3 !important;
    font-weight: 600 !important;
    letter-spacing: 0.02em !important;
    background: rgba(183, 107, 82, 0.12) !important;
    color: #f4d7b5 !important;
    border: 1px solid rgba(217, 154, 114, 0.25) !important;
  }

  #main .page .project-card__badge {
    background: rgba(255, 255, 255, 0.03) !important;
    color: #d9c6af !important;
    border-color: rgba(217, 154, 114, 0.2) !important;
  }

  #main .page .project-card h3 {
    margin: 0 0 10px !important;
    font-size: 1.35rem !important;
    line-height: 1.35 !important;
    color: #f3efe9 !important;
  }

  #main .page .project-card__body p {
    flex-grow: 1 !important;
    margin: 0 0 18px !important;
    font-size: 0.95rem !important;
    line-height: 1.7 !important;
    color: #d9c6af !important;
    min-height: 96px !important;
  }

  #main .page .project-card__button {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: min(100%, 220px) !important;
    margin: 0 auto !important;
    padding: 11px 14px !important;
    border: none !important;
    border-radius: 10px !important;
    background: linear-gradient(180deg, #b76b52 0%, #d99a72 100%) !important;
    color: #fffaf4 !important;
    font-size: 0.94rem !important;
    font-weight: 700 !important;
    cursor: pointer !important;
    transition: opacity 0.2s ease, transform 0.2s ease !important;
  }

  #main .page .project-card__button:hover {
    opacity: 0.96 !important;
    transform: translateY(-1px) !important;
  }

  @media (max-width: 980px) {
    #main .page .project-grid {
      grid-template-columns: repeat(2, minmax(260px, 1fr)) !important;
    }
  }

  @media (max-width: 640px) {
    #main .page .project-grid {
      grid-template-columns: 1fr !important;
    }

    #main .page .project-card__body {
      padding: 16px !important;
    }

    #main .page .project-card__button {
      width: 100% !important;
    }
  }

  .project-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    padding: 20px;
  }

  .project-modal-overlay.is-open {
    display: flex !important;
  }

  .project-modal {
    background: #0F172A;
    padding: 30px;
    border-radius: 12px;
    max-width: 600px;
    width: 100%;
    position: relative;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.38);
    color: #f3efe9;
    border: 1px solid rgba(217, 154, 114, 0.2);
  }

  .project-modal__close {
    position: absolute;
    top: 10px;
    right: 15px;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #f4d7b5;
  }
</style>

<div id="main" role="main">
  <article class="page" itemscope itemtype="https://schema.org">
    <div class="page__inner-wrap">
      <header>
        <h1 id="page-title" class="page__title" itemprop="headline">Proiecte</h1>
      </header>

      <div class="page__content" itemprop="text">
        <div class="project-grid">
          {% assign project_list = site.proiecte %}
          {% if project_list %}
            {% for project in project_list %}
              <article class="project-card" data-project-index="{{ forloop.index0 }}">
                <img src="{{ project.image | relative_url }}" alt="{{ project.title | escape }}" class="project-card__image" />
                <div class="project-card__body">
                  <div class="project-card__meta-row">
                    <span class="project-card__tag project-card__tag--{{ project.audience | downcase | replace: ' ', '-' | replace: '(', '' | replace: ')', '' }}">{{ project.audience }}</span>
                    <span class="project-card__badge">{{ project.duration }}</span>
                    <span class="project-card__badge">{{ project.tech }}</span>
                  </div>
                  <h3>{{ project.title }}</h3>
                  <p>{{ project.summary }}</p>

                  <button type="button"
                          class="project-card__button"
                          data-title="{{ project.title | escape }}"
                          data-audience="{{ project.audience | escape }}"
                          data-duration="{{ project.duration | escape }}"
                          data-tech="{{ project.tech | escape }}"
                          data-details="{{ project.details | escape }}"
                          data-milestones='{{ project.milestones | jsonify | escape }}'>
                    Vezi detalii
                  </button>
                </div>
              </article>
            {% endfor %}
          {% endif %}
        </div>
      </div>
    </div>
  </article>
</div>

<div class="project-modal-overlay" aria-hidden="true">
  <div class="project-modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <button class="project-modal__close" aria-label="Închide">×</button>
    <div id="project-modal-content"></div>
  </div>
</div>

<script>
  const projectCards = document.querySelectorAll('.project-card');
  const modal = document.querySelector('.project-modal-overlay');
  const modalContent = document.getElementById('project-modal-content');
  const closeButton = document.querySelector('.project-modal__close');

  const renderProjectModal = (project) => {
    const milestonesHTML = Array.isArray(project.milestones)
      ? project.milestones.map(item => `<li>${item}</li>`).join('')
      : '';

    const audienceClass = (project.audience || '')
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[()]/g, '');

    modalContent.innerHTML = `
      <h3 id="project-modal-title" style="margin-top: 0;">${project.title || ''}</h3>
      <div class="project-modal__meta" style="margin-bottom: 15px;">
        <span class="project-card__tag project-card__tag--${audienceClass}">${project.audience || ''}</span> |
        <span class="project-card__badge">${project.duration || ''}</span> |
        <span class="project-card__badge">${project.tech || ''}</span>
      </div>
      <p><strong>Descriere:</strong> ${project.details || ''}</p>
      <h4 style="margin-bottom: 5px;">Ce învățăm:</h4>
      <ul>
        ${milestonesHTML}
      </ul>
    `;
  };

  projectCards.forEach((card) => {
    const button = card.querySelector('.project-card__button');
    if (!button) return;

    button.addEventListener('click', () => {
      let milestones = [];
      try {
        milestones = JSON.parse(button.getAttribute('data-milestones')) || [];
      } catch (e) {
        milestones = [];
      }

      const project = {
        title: button.getAttribute('data-title'),
        audience: button.getAttribute('data-audience'),
        duration: button.getAttribute('data-duration'),
        tech: button.getAttribute('data-tech'),
        details: button.getAttribute('data-details'),
        milestones: milestones
      };

      renderProjectModal(project);
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden', 'false');
    });
  });

  closeButton.addEventListener('click', () => {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
  });

  modal.addEventListener('click', (event) => {
    if (event.target === modal) {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
    }
  });
</script>
